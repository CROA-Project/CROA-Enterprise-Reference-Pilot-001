name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit-audit:
    name: Lint, unit tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check croa_plane c6_firewall acmeops_api scripts tests/unit
      - name: Unit tests (in-process, mocked transport, fault injection)
        run: pytest -q
      - name: Dependency audit (application requirements)
        run: pip-audit -r croa_plane/requirements.txt -r acmeops_api/requirements.txt

  compose-integration:
    name: Compose stack + scenario harness
    runs-on: ubuntu-latest
    needs: lint-unit-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Bootstrap keys and secrets
        run: |
          python scripts/generate_pilot_keys.py
          printf 'DEMO_CONTROL_SECRET=%s\nINTERNAL_SERVICE_SECRET=%s\nECC_TTL_SECONDS=300\n' \
            "$(python -c 'import secrets;print(secrets.token_urlsafe(24))')" \
            "$(python -c 'import secrets;print(secrets.token_urlsafe(24))')" > .env
      - name: Build and start (normal mode)
        run: docker compose up --build --wait --wait-timeout 120
      - name: Scenario harness (normal mode)
        run: |
          set -e
          docker exec -i croa-pilot-001-c6_firewall-1 python - < tests/test_phase5.py
          docker exec -i croa-pilot-001-croa_plane-1 python - < tests/test_phase3.py
          docker exec -i croa-pilot-001-croa_plane-1 python - < tests/test_ttl_enforcement.py
      - name: Restart in test mode and run test-mode harness
        run: |
          set -e
          docker compose down
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --wait --wait-timeout 120
          docker exec -i croa-pilot-001-c6_firewall-1 python - < tests/test_phase4.py
          docker exec -i croa-pilot-001-croa_plane-1 python - < tests/test_hardening.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
